<html>
<head>
    <title>Chi paga il caffè?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="player-management.js"></script>
</head>
<body>
<div id="player-selection" class="container-fluid mt-5">
    <h1 class="title text-center">Player Selection</h1>
    <div class="row d-flex flex-column justify-content-center">
        <div class="text-center">
            <button type="button" class="btn btn-secondary" onclick="managePlayers()">Player Management</button>
            <button type="button" class="btn btn-secondary" id="start-button" onclick="startGame()" disabled>Start
            </button>
        </div>
        <div id="player-buttons" class="mx-5 my-0">
            <!-- Player buttons will be dynamically added here -->
        </div>
    </div>
</div>

<div id="padding-br">
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
</div>

<div id="main" class="container-fluid mt-5" style="display: none;">
    <h1 class="title text-center">Chi paga il caff&egrave;?</h1>
    <div id="current-player" class="text-center"></div>
    <div id="chance-percentage" class="text-center chance-display"></div>
    <div class="row d-flex flex-column justify-content-center">
        <div class="mx-5 my-0">
            <div id="estremo-massimo" class="text-center estremo">9999</div>
        </div>
        <div class="mx-5 my-0">
            <div class="form-group m-0">
                <input type="number" class="form-control" id="numero" min="0" max="9999"
                       placeholder="Inserisci un numero" readonly>
            </div>
        </div>
        <div class="mx-5 my-0">
            <div id="estremo-minimo" class="text-center estremo">0</div>
        </div>
        <div class="text-center">
            <div id="numpad" class="numpad">
                <button type="button" class="numpad-btn" onclick="appendDigit('7')">7</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('8')">8</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('9')">9</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('4')">4</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('5')">5</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('6')">6</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('1')">1</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('2')">2</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('3')">3</button>
                <button type="button" class="numpad-btn numpad-backspace" onclick="backspaceDigit()">&#9003;</button>
                <button type="button" class="numpad-btn" onclick="appendDigit('0')">0</button>
                <button type="button" class="numpad-btn numpad-enter" onclick="guess()">&#9166;</button>
            </div>
        </div>
    </div>
    <div id="sudoreGif" class="row sudore">
        <div class="col-12 d-flex flex-column justify-content-center">
            <img src="assets/sudore.gif" class="img-fluid rounded m-5">
        </div>
    </div>
    <div class="row footer">
        <div class="col-sm-12">
            <div class="text-center">
                <small class="text-muted">KylesDev - v0.3</small>
            </div>
        </div>
    </div>
</div>
<h1 id="paga" class='text-center display-1 mt-5'>PAGARE !!!</h1>

<div id="leaderboard" class="container-fluid mt-5">
    <h2 class="title text-center">Leaderboard</h2>
    <!-- Leaderboard entries will be dynamically added here -->
</div>

<script src="script.js"></script>
</body>
</html>
